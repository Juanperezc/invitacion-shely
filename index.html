<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Cena en Namida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: una escena nocturna a lo ancho; dos suricatas caminan hasta la puerta de Namida; la tarjeta va debajo */
:root{
  --night:#141a33; --night2:#232c57; --moon:#fbe9b7; --lamp:#ffb84d;
  --fur:#d6a96b; --fur-dark:#8a5a2b; --ink:#f6efe2; --muted:#b7b9d6;
  --display:"Fraunces",Georgia,serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night));color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.scene{width:100%;max-width:100%;aspect-ratio:16/9;display:block;border-radius:18px;overflow:hidden}
.eyebrow{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lamp);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--lamp)}
.time{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,6vw,2.4rem);margin:0;display:flex;gap:.4em;align-items:center}
.time small{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
p.note{max-width:34ch;color:var(--muted);font-size:1.05rem;line-height:1.5;margin:0}
.btn{font:700 1rem var(--body);background:var(--lamp);color:#2a1a05;border:0;border-radius:999px;padding:.8em 1.6em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--lamp)}
.btn:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
#ok{color:var(--lamp);font-weight:700;margin:0}

/* animación */
.walker{animation:walk 9s ease-in-out forwards}
.nightfall{opacity:0;animation:night 9s linear forwards}
.sun{animation:sunset 9s linear forwards}
.petal{animation:petal 6s linear infinite}
body:not(.opened) .nightfall,body:not(.opened) .sun{animation-play-state:paused}
@keyframes night{0%,15%{opacity:0}70%,100%{opacity:1}}
@keyframes sunset{0%,10%{transform:translateY(0)}60%,100%{transform:translateY(260px)}}
@keyframes petal{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(-50px,200px) rotate(260deg);opacity:0}}
.ticket{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 22px;padding:16px 22px;border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ticket .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.18)}
.ticket .k{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lamp);font-weight:700}
.ticket .v{font-family:var(--display);font-weight:800;font-size:1.25rem}
#ok{animation:rise .6s ease both}
.stops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%}
.stop{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:left;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.stop .ico{grid-row:span 3;font-size:2rem}
.stop .when{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lamp);font-weight:700}
.stop .what{font-family:var(--display);font-weight:800;font-size:1.35rem}
.stop .where{color:var(--muted)}
.walker.b{animation-delay:.6s}
.bob{animation:bob .45s ease-in-out infinite alternate}
.legL{transform-origin:0 0;animation:step .45s ease-in-out infinite alternate}
.legR{transform-origin:0 0;animation:step .45s ease-in-out infinite alternate-reverse}
.arrived .bob,.arrived .legL,.arrived .legR{animation:none}
.tail{transform-origin:0 0;animation:wag 1.2s ease-in-out infinite alternate}
.star{animation:twinkle 2.4s ease-in-out infinite alternate}
.glow{animation:glow 3s ease-in-out infinite alternate}
/* cruzan Palermo al atardecer y llegan a la puerta de Namida de noche */
@keyframes walk{from{transform:translateX(-640px)}to{transform:translateX(80px)}}
@keyframes bob{to{transform:translateY(-4px)}}
@keyframes step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes wag{to{transform:rotate(14deg)}}
@keyframes twinkle{to{opacity:.25}}
@keyframes glow{to{opacity:.6}}
body:not(.opened) .walker{animation-play-state:paused}

/* sobre */
.envelope-stage{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;perspective:900px}
.envelope{position:relative;width:min(340px,88vw);aspect-ratio:3/2;background:#e9d5b0;border-radius:10px;cursor:pointer;border:0;padding:0;
  box-shadow:0 24px 50px rgba(0,0,0,.45);animation:float 2.4s ease-in-out infinite alternate}
.envelope:focus-visible{outline:3px solid var(--lamp);outline-offset:6px}
.envelope .pocket{position:absolute;inset:0;border-radius:10px;z-index:3;
  background:linear-gradient(to top right,#dcc297 50%,transparent 50.5%) left/50.5% 100% no-repeat,linear-gradient(to top left,#d4b88a 50%,transparent 50.5%) right/50.5% 100% no-repeat}
.envelope .flap{position:absolute;inset:0 0 auto;height:62%;z-index:4;background:#cfb07c;clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .7s ease, z-index 0s .35s}
.envelope .card{position:absolute;left:7%;right:7%;top:8%;bottom:8%;z-index:2;background:#fff8ec;border-radius:6px;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;color:#8a5a2b;font-size:1.3rem;transition:transform .8s cubic-bezier(.3,.1,.2,1.3) .55s}
.envelope .seal{position:absolute;left:50%;top:58%;z-index:5;width:56px;height:56px;margin:-28px;border-radius:50%;background:#c0392b;color:#fbe9b7;
  display:grid;place-items:center;font:800 1.6rem var(--display);box-shadow:inset 0 0 0 4px #a5301f;transition:opacity .3s}
.envelope .to{position:absolute;left:0;right:0;bottom:12%;z-index:5;font:700 1rem var(--body);color:#6b4a26;letter-spacing:.06em}
.envelope.open{animation:none}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .seal,.envelope.open .to{opacity:0}
.envelope.open .card{transform:translateY(-70%)}
.hint{color:var(--muted);font-size:.95rem;margin:0;animation:twinkle 1.2s ease-in-out infinite alternate}
.reveal{animation:rise .9s ease both}
@keyframes float{to{transform:translateY(-8px) rotate(-1deg)}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.nightfall{opacity:1}}
</style>

<div class="envelope-stage" id="stage">
  <button class="envelope" id="env" type="button" aria-label="Abrir la invitación para Shely">
    <span class="card">¡Shely! 🐾</span>
    <span class="pocket"></span>
    <span class="flap"></span>
    <span class="seal">S</span>
    <span class="to">Para Shely · de Juan</span>
  </button>
  <p class="hint">Tocá el sobre para abrirlo</p>
</div>

    <!-- jacarandá de Palermo -->
    <g transform="translate(300 362)">
      <g fill="#c49af0"><circle class="petal" cx="-30" cy="-150" r="4"/><circle class="petal" style="animation-delay:1.5s" cx="20" cy="-170" r="3.5"/><circle class="petal" style="animation-delay:3s" cx="50" cy="-140" r="4"/><circle class="petal" style="animation-delay:4.2s" cx="-10" cy="-130" r="3"/></g>
      <path d="M0 0 C-4 -60 6 -110 -2 -150 M0 -90 q30 -20 46 -50 M-2 -110 q-28 -14 -40 -40" stroke="#3b2a20" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="#9b6fd6"><circle cx="-40" cy="-160" r="34"/><circle cx="10" cy="-185" r="40"/><circle cx="52" cy="-150" r="32"/><circle cx="-6" cy="-140" r="30"/></g>
      <g fill="#c49af0"><circle cx="-24" cy="-176" r="14"/><circle cx="26" cy="-196" r="12"/><circle cx="48" cy="-162" r="10"/><circle cx="-52" cy="-148" r="9"/></g>
      <g fill="#c49af0"><circle cx="-60" cy="-4" r="3"/><circle cx="30" cy="-2" r="2.5"/><circle cx="70" cy="-5" r="3"/><circle cx="-20" cy="-3" r="2"/></g>
    </g>
    <!-- farol con cartel de calle porteño -->
    <g transform="translate(420 362)">
      <rect x="-3" y="-190" width="6" height="190" fill="#11131f"/>
      <path d="M-12 -196 h24 l-6 -22 h-12 z" fill="#11131f"/>

      <rect x="-9" y="-216" width="18" height="16" fill="#ffd98a"/>
      <rect x="6" y="-140" width="96" height="26" rx="3" fill="#0d0d0d" stroke="#f6efe2" stroke-width="2"/>
      <text x="54" y="-122" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-weight="700" font-size="13" fill="#f6efe2" letter-spacing="1">PALERMO</text>
    </g>
    <!-- vereda y adoquines -->
    <rect y="360" width="800" height="90" fill="#1a1530"/>
    <path d="M0 362 H800" stroke="#3a3160" stroke-width="3"/>
    <g fill="#241d40" stroke="#2f2752" stroke-width="2">
      <rect x="0" y="392" width="800" height="58"/>
    </g>
    <path d="M0 410 H800 M0 430 H800" stroke="#2f2752" stroke-width="2"/>
    <path d="M20 392v18M80 392v18M140 392v18M200 392v18M260 392v18M320 392v18M380 392v18M440 392v18M500 392v18M560 392v18M620 392v18M680 392v18M740 392v18M50 410v20M110 410v20M170 410v20M230 410v20M290 410v20M350 410v20M410 410v20M470 410v20M530 410v20M590 410v20M650 410v20M710 410v20M770 410v20" stroke="#2f2752" stroke-width="2"/>
    <!-- restaurante -->
    <g transform="translate(540 120)">
      <rect x="0" y="40" width="240" height="200" fill="#2b2246"/>
      <path d="M-14 46 L120 0 L254 46 Z" fill="#40335f"/>
      <rect x="20" y="62" width="200" height="50" rx="6" fill="#1a1530"/>
      <text x="120" y="88" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="800" font-size="24" fill="#ffb84d" letter-spacing="3">NAMIDA</text>
      <text x="120" y="104" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-weight="700" font-size="10" fill="#b7b9d6" letter-spacing="4">SUSHI BAR</text>
      <!-- roll de sushi -->
      <g transform="translate(40 87)"><circle r="11" fill="#1d2b1f"/><circle r="8" fill="#fff6e8"/><circle r="4" fill="#ff7a59"/></g>
      <g transform="translate(200 87)"><circle r="11" fill="#1d2b1f"/><circle r="8" fill="#fff6e8"/><circle r="4" fill="#ff7a59"/></g>
      <circle class="glow" cx="120" cy="190" r="110" fill="url(#lampG)"/>

      <rect x="85" y="130" width="70" height="30" fill="#c0392b"/>

      <g class="glow"><ellipse cx="50" cy="150" rx="12" ry="16" fill="#ff8a3d"/><ellipse cx="190" cy="150" rx="12" ry="16" fill="#ff8a3d"/></g>
      <path d="M50 130 v4 M190 130 v4" stroke="#ffcf7a" stroke-width="2"/>
      <rect x="20" y="130" width="44" height="0" fill="none"/>
    </g>
    <!-- suricatas: terminan frente a la puerta -->
    <g id="m1" class="walker a"><use href="#meerkat" transform="translate(520 362)"/>
      <g transform="translate(520 362)"><g class="bob">
        <g transform="translate(-8 -106)" fill="#ff7eb6"><circle cx="0" cy="-6" r="5"/><circle cx="6" cy="0" r="5"/><circle cx="0" cy="6" r="5"/><circle cx="-6" cy="0" r="5"/><circle r="3.5" fill="#ffd45c"/></g>
        <rect x="-17" y="-66" width="42" height="17" rx="8" fill="#ffb84d" stroke="#2a1a05" stroke-width="1.5"/>
        <text x="4" y="-54" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="800" font-size="11" fill="#2a1a05">Shely</text>
      </g></g>
    </g>
    <g id="m2" class="walker b"><use href="#meerkat" transform="translate(455 362) scale(.88)"/>
      <g transform="translate(455 362) scale(.88)"><g class="bob">
        <path d="M-4 -78 l-10 -6 v12 z M12 -78 l10 -6 v12 z" fill="#c0392b"/><circle cx="4" cy="-78" r="4" fill="#8e2a1f"/>
        <rect x="-15" y="-66" width="38" height="17" rx="8" fill="#9fd3f0" stroke="#2a1a05" stroke-width="1.5"/>

  <p class="eyebrow">Palermo · Buenos Aires</p>
  <h1><span>Shely</span>, estás invitada</h1>
  <p class="note">a una noche de sushi entre suricatas</p>
  <div class="ticket">
    <div><span class="k">Dónde</span><span class="v">Namida Sushi Bar</span></div>
    <span class="sep" aria-hidden="true"></span>
    <div><span class="k">Hora</span><span class="v">9:00 PM</span></div>
    <span class="sep" aria-hidden="true"></span>
    <div><span class="k">Barrio</span><span class="v">Palermo, BA</span></div>
  </div>
  <p class="note">Juan y Shely, dos suricatas cruzando Palermo. Vení con hambre. 🍣</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="go" type="button">¡Ahí estaré!</button>
    <button class="btn ghost" id="music" type="button" aria-pressed="false">♪ Poner música</button>
  </div>
  <p id="ok" hidden>Listo, te guardamos el puesto 🥢</p>
</div>

<script>
document.querySelectorAll('.walker').forEach(w=>w.addEventListener('animationend',e=>{if(e.animationName==='walk')w.classList.add('arrived')}));
document.getElementById('go').addEventListener('click',()=>{document.getElementById('ok').hidden=false;document.getElementById('go').hidden=true;startMusic()});

// Musiquita generada en el navegador (escala pentatónica), sin archivos externos.
let ctx,timer,playing=false;
const mel=[0,2,4,7,9,7,4,2, 4,7,9,12,9,7,4,null, 0,4,7,4,2,4,0,null, 9,7,4,2,4,2,0,null];
const bass=[0,0,-5,-5,-3,-3,-5,-5];
function note(semi,t,dur,type,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(semi-9)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.05)}
function startMusic(){
  if(playing)return;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){return}
  playing=true;const btn=document.getElementById('music');btn.textContent='⏸ Pausar música';btn.setAttribute('aria-pressed','true');
  const step=.22;let i=0,t=ctx.currentTime+.05;
  timer=setInterval(()=>{while(t<ctx.currentTime+.4){const m=mel[i%mel.length];if(m!==null)note(m,t,.35,'triangle',.18);
    if(i%4===0)note(bass[(i/4)%bass.length]-12,t,.8,'sine',.22);t+=step;i++}},100);
}
function stopMusic(){playing=false;clearInterval(timer);const btn=document.getElementById('music');btn.textContent='♪ Poner música';btn.setAttribute('aria-pressed','false')}
document.getElementById('music').addEventListener('click',()=>playing?stopMusic():startMusic());

const env=document.getElementById('env');
env.addEventListener('click',()=>{
  if(env.classList.contains('open'))return;
  env.classList.add('open');startMusic();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{document.getElementById('stage').hidden=true;const inv=document.getElementById('inv');inv.hidden=false;inv.classList.add('reveal');
    document.body.classList.add('opened');window.scrollTo(0,0)},reduce?0:1700);
});
</script>
</html>
